<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Economía móvil</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 20px;
    }

    #balance {
      font-size: 36px;
      font-weight: bold;
      color: #1b7a2f;
      margin-bottom: 6px;
    }

    #dateText {
      font-size: 16px;
      color: #555;
    }

    /* CALENDARIO */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .day {
      padding: 10px 0;
      text-align: center;
      border-radius: 8px;
      background: #eee;
      font-size: 14px;
      user-select: none;
    }

    .today {
      background: #2f80ed;
      color: white;
      font-weight: bold;
      box-shadow: 0 0 0 2px rgba(47,128,237,0.3);
    }

    .task,
    .payment {
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
    }

    .task {
      background: #ececec;
    }

    .payment {
      background: #ffe7b3;
    }

    .paid {
      background: #b7f5c4;
    }

    .task:active,
    .payment:active {
      transform: scale(0.98);
    }

    .price {
      float: right;
      font-weight: bold;
    }

    .hint {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }

  </style>
</head>

<body>

  <!-- ECONOMÍA -->
  <div class="panel">

    <h2>Cartera</h2>

    <div id="balance">0 €</div>

    <div id="dateText"></div>

  </div>

  <!-- CALENDARIO -->
  <div class="panel">

    <h2>Calendario</h2>

    <div id="calendar" class="calendar"></div>

    <div class="hint">
      El día actual está resaltado
    </div>

  </div>

  <!-- TAREAS -->
  <div class="panel">

    <h2>Bolsa de tareas</h2>

    <div id="taskPool"></div>

  </div>

  <!-- ASIGNADAS -->
  <div class="panel">

    <h2>Tareas asignadas</h2>

    <div id="assignedTasks"></div>

  </div>

  <!-- PAGOS -->
  <div class="panel">

    <h2>Pagos mensuales</h2>

    <div id="monthlyPayments"></div>

  </div>

<script>

let balance = 0;

let tasks = [
  "Limpiar baño",
  "Hacer comida",
  "Reparar mesa",
];

let assigned = [];

let payments = [
  { name: "Alquiler", cost: 100, paid: false },
  { name: "Bono comida", cost: 20, paid: false }
];

const monthNames = [
  "Enero","Febrero","Marzo","Abril","Mayo","Junio",
  "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
];

// ===== FECHA REAL =====
function getDate() {
  return new Date();
}

function updateDate() {
  const now = getDate();

  document.getElementById("dateText").innerText =
    now.getDate() + " " +
    monthNames[now.getMonth()] + " " +
    now.getFullYear();
}

// ===== CALENDARIO =====
function renderCalendar() {

  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  const now = getDate();

  const year = now.getFullYear();
  const month = now.getMonth();
  const today = now.getDate();

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // ajustar domingo
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;

  // espacios vacíos
  for (let i = 0; i < startOffset; i++) {
    const empty = document.createElement("div");
    calendar.appendChild(empty);
  }

  // días
  for (let d = 1; d <= daysInMonth; d++) {

    const div = document.createElement("div");
    div.className = "day";
    div.innerText = d;

    if (d === today) {
      div.classList.add("today");
    }

    calendar.appendChild(div);
  }
}

// ===== BALANCE =====
function updateBalance() {
  document.getElementById("balance").innerText = balance + " €";
}

// ===== TAREAS =====
function assignTask(index) {
  assigned.push(tasks[index]);
  tasks.splice(index, 1);
  render();
}

function completeTask(index) {
  assigned.splice(index, 1);
  balance += 1;
  updateBalance();
  render();
}

// ===== PAGOS =====
function payMonthly(index) {
  if (payments[index].paid) return;
  payments[index].paid = true;
  balance -= payments[index].cost;
  updateBalance();
  render();
}

// ===== RENDER =====
function render() {

  const taskPool = document.getElementById("taskPool");
  const assignedTasks = document.getElementById("assignedTasks");
  const monthlyDiv = document.getElementById("monthlyPayments");

  taskPool.innerHTML = "";
  assignedTasks.innerHTML = "";
  monthlyDiv.innerHTML = "";

  tasks.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "task";
    div.innerText = t;
    div.onclick = () => assignTask(i);
    taskPool.appendChild(div);
  });

  assigned.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "task";
    div.innerText = t;
    div.onclick = () => completeTask(i);
    assignedTasks.appendChild(div);
  });

  payments.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "payment";
    if (p.paid) div.classList.add("paid");

    div.innerHTML =
      p.name +
      "<span class='price'>" +
      (p.paid ? "Pagado" : "-" + p.cost + "€") +
      "</span>";

    div.onclick = () => payMonthly(i);

    monthlyDiv.appendChild(div);
  });
}

// ===== INICIO =====
updateBalance();
updateDate();
renderCalendar();
render();

// actualización automática
setInterval(() => {
  updateDate();
  renderCalendar();
}, 60000);

</script>

</body>
</html>
